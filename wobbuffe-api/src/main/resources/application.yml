spring:
  application:
    name: wobbuffe-api
  datasource:
    url: jdbc:h2:mem:pokemon;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

wobbuffe:
  # Wobbuffe Starter: retry, timeout, circuit breaker e elegibilidade de roteamento desta integração.
  integrations:
    pokeapi:
      enabled: true
      async-eligible: true
      timeout: 3s
      max-attempts: 3
      initial-backoff: 200ms
      max-backoff: 2s
  # Wobbuffe Starter: admissão adaptativa e limites de publicação assíncrona.
  routing:
    enabled: false
    max-percent: 25
    step-percent: 5
    max-pending: 1000
    evaluation-interval: 10s
  # Wobbuffe Starter: configura autoconfiguração do cliente e publisher SQS.
  sqs:
    endpoint: ${WOBBUFFE_SQS_ENDPOINT:}
    queue-url: ${WOBBUFFE_SQS_QUEUE_URL:}
    region: ${AWS_DEFAULT_REGION:us-east-1}
  # O starter executa o consumer no próprio processo da API quando habilitado.
  consumer:
    enabled: ${WOBBUFFE_CONSUMER_ENABLED:false}
    queue-url: ${WOBBUFFE_CONSUMER_QUEUE_URL:${WOBBUFFE_SQS_QUEUE_URL:}}
    dlq-url: ${WOBBUFFE_CONSUMER_DLQ_URL:}
    poll-wait-seconds: ${WOBBUFFE_CONSUMER_POLL_WAIT_SECONDS:20}
    batch-size: ${WOBBUFFE_CONSUMER_BATCH_SIZE:5}
    visibility-timeout-seconds: ${WOBBUFFE_CONSUMER_VISIBILITY_TIMEOUT_SECONDS:90}
    max-receive-count: ${WOBBUFFE_CONSUMER_MAX_RECEIVE_COUNT:5}
    max-concurrency: ${WOBBUFFE_CONSUMER_MAX_CONCURRENCY:2}
    rate-limit-per-second: ${WOBBUFFE_CONSUMER_RATE_LIMIT_PER_SECOND:5}
    max-message-bytes: ${WOBBUFFE_CONSUMER_MAX_MESSAGE_BYTES:262144}
    poll-delay-millis: ${WOBBUFFE_CONSUMER_POLL_DELAY_MILLIS:1000}
    queue-metrics-delay-millis: ${WOBBUFFE_CONSUMER_QUEUE_METRICS_DELAY_MILLIS:30000}
  # Propriedades da API para o cliente HTTP da PokéAPI.
  pokeapi:
    base-url: ${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}
    connect-timeout: 2s
    read-timeout: 3s
